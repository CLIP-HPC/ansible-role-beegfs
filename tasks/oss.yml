---
- name: Install packages for BeeGFS object storage server
  ansible.builtin.package:
    name:
      - beegfs-storage
      - libbeegfs-ib # Infiniband support
    state: "{{ beegfs_package_action }}"
  become: true
  notify: Restart BeeGFS storage service

- name: Create a list of devices that are mounted
  ansible.builtin.set_fact:
    mounted_devs: "{{ ansible_mounts | map(attribute='device') | list }}"

- name: Create storage config dirs
  ansible.builtin.file:
    path: "/etc/beegfs/{{ oss_port }}.d/"
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true

- name: Create connInterfacesFile
  vars:
    beegfs_interfaces: "{{ interfaces }}"
  ansible.builtin.template:
    src: connInterfacesFile.j2
    dest: /etc/beegfs/{{ oss_port }}.d/connInterfacesFile
    mode: "0644"
    owner: root
    group: root
  become: true

- name: Add template beegfs-storage conf
  ansible.builtin.copy:
    src: "/etc/beegfs/beegfs-storage.conf"
    dest: "/etc/beegfs/{{ oss_port }}.d/beegfs-storage.conf"
    remote_src: true
    force: false
    mode: "0644"
    owner: root
    group: root
  become: true
  notify: Restart BeeGFS storage service

- name: Set Storage Port
  ansible.builtin.lineinfile:
    path: "/etc/beegfs/{{ oss_port }}.d/beegfs-storage.conf"
    regexp: '^connStoragePort'
    line: "connStoragePort = {{ oss_port }}"
  become: true
  notify: Restart BeeGFS storage service

- name: Specify connInterfacesFile
  ansible.builtin.lineinfile:
    path: "/etc/beegfs/{{ oss_port }}.d/beegfs-storage.conf"
    regexp: "^connInterfacesFile"
    line: "connInterfacesFile           = /etc/beegfs/{{ oss_port }}.d/connInterfacesFile"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart BeeGFS storage service

- name: Prepare storage devices
  ansible.builtin.include_tasks: fs.yml
  vars:
    oss_path: "{{ beegfs_oss_path_prefix + oss_dev }}"
  tags: ["beegfs", "oss", "fs"]
  args:
    apply:
      tags: ["beegfs", "oss", "fs"]
  loop: "{{ oss_devices }}"
  loop_control:
    loop_var: oss_dev


- name: Run storage service setup script
  vars:
    oss_path: "{{ beegfs_oss_path_prefix + item }}"
    oss_replace: "{{ '-r' if ix == 0 else '' }}"
    oss_target_id: "{{ (oss_num_id | int) + (ix + 1) }}"
  loop: "{{ oss_devices }}"
  loop_control:
    index_var: ix
  ansible.builtin.command: |
    /opt/beegfs/sbin/beegfs-setup-storage -f \
    -p {{ oss_path }}  \
    {{ oss_replace }} \
    -m {{ beegfs_mgmt_host }} \
    -c /etc/beegfs/{{ oss_port }}.d/beegfs-storage.conf \
    -s {{ oss_num_id | int }} \
    -i {{ oss_target_id | int }} \
  args:
    creates: "{{ oss_path }}/targetNumID"
  become: true
  notify: Restart BeeGFS storage service
