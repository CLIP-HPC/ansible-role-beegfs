---

- name: Check for ofed_info
  ansible.builtin.command: "ofed_info -s"
  register: _ofed_info
  failed_when: false
  changed_when: false
  tags: install

- name: Determine if ofed is in use
  ansible.builtin.set_fact:
    beegfs_ofed_installed: "{{ _ofed_info.rc == 0 }}"
  tags: install

- name: Check for NVFS include path
  ansible.builtin.shell: "find /usr/src/nvidia-* -name nvfs-dma.h"
  register: _nvfs_include_path
  failed_when: _nvfs_include_path.rc > 1
  changed_when: false
  tags: install


- name: Set NVFS include path
  ansible.builtin.set_fact:
    beegfs_nvfs_include_path: "{{ _nvfs_include_path.stdout | trim | dirname }}"
  when: _nvfs_include_path.rc == 0
  tags: install

- name: Run configure to generate config-host.h in the NVFS include directory
  ansible.builtin.command:
    cmd: ./configure
    creates: "{{ beegfs_nvfs_include_path }}/config-host.h"
  args:
    chdir: "{{ beegfs_nvfs_include_path }}"
  when: beegfs_nvfs_include_path != None
  tags: install


- name: Check for NVIDIA include path
  ansible.builtin.shell: "find /usr/src/nvidia-*/nvidia/ -name nv-p2p.h"
  register: _nvidia_include_path
  failed_when: _nvidia_include_path.rc > 1
  changed_when: false
  tags: install

- name: Set NVIDIA include path
  ansible.builtin.set_fact:
    beegfs_nvidia_include_path: "{{ _nvidia_include_path.stdout | trim | dirname }}"
  when: _nvidia_include_path.rc == 0
  tags: install

- name: Generate beegfs-client-build.mk
  become: true
  ansible.builtin.template:
    dest: /etc/beegfs/beegfs-client-build.mk
    src: beegfs-client-build.mk.j2
    mode: "0644"
  when: beegfs_enable.client | bool
  tags: install


- name: install | Build host-specific list of required beegfs packages
  become: true
  tags: install
  ansible.builtin.set_fact:
    beegfs_pkglist: "{{ beegfs_pkglist | default([]) + item.value }}"
  loop: "{{ beegfs_packages | dict2items }}"
  when: (beegfs_enable.get(item.key, false))

- name: install | Install required beegfs packages
  become: true
  tags: install
  ansible.builtin.dnf:
    name: "{{ beegfs_pkglist | reject('eq', '') }}"
    state: "{{ beegfs_package_action }}"
    install_weak_deps: false # avoids getting recommended packages
  when: beegfs_pkglist | length > 0

- name: install | Install RDMA packages
  become: true
  tags: install
  ansible.builtin.package:
    name: "{{ beegfs_distro_vars[ansible_os_family]['rdma_dev_pkgs'] }}"
    state: "{{ beegfs_package_action }}"
  when: beegfs_rdma | bool

# Workaround because of kernel backport
- name: Fix kernel issue
  when: beegfs_enable.client | bool
  tags: install
  block:
    - name: Load beegfs module
      become: true
      community.general.modprobe:
        name: beegfs
        state: present
      ignore_errors: true
      register: _beegfs_modprobe

    - name: Apply RdmaInfo.c.patch file
      become: true
      ansible.posix.patch:
        src: RdmaInfo.c.patch
        basedir: /usr/src/beegfs-8.1.0/source
      tags: install
      when: _beegfs_modprobe.rc is defined and _beegfs_modprobe.rc != 0

    - name: Run DKMS autoinstall
      become: true
      ansible.builtin.command: /usr/sbin/dkms autoinstall
      when: _beegfs_modprobe.rc is defined and _beegfs_modprobe.rc != 0
      register: _dkms_autoinstall
      changed_when: _dkms_autoinstall.rc != 0
